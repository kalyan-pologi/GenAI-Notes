<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" font-family="'Comic Sans MS','Segoe Print',cursive" role="img" aria-label="Claude Code agentic loop: prompt goes to think, then act with a tool, then observe the result, looping until done, then returns the answer">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.5"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6" fill="none" stroke="#2b2b2b" stroke-width="1.4"/>
    </marker>
  </defs>

  <style>
    .box  { filter:url(#rough); stroke:#2b2b2b; stroke-width:2; fill:#fff; }
    .green{ fill:#5fbf72; }
    .red  { fill:#ec6a3c; }
    .grey { fill:#f4f4f4; }
    .lbl  { font-size:17px; fill:#1c1c1c; }
    .lblw { font-size:17px; fill:#fff; font-weight:bold; }
    .sub  { font-size:12px; fill:#555; }
    .subw { font-size:12px; fill:#f2f2f2; }
    .edge { stroke:#2b2b2b; stroke-width:1.8; fill:none; filter:url(#rough); marker-end:url(#arrow); }
    .elbl { font-size:12px; fill:#333; }
    text  { text-anchor:middle; }
  </style>

  <!-- Title -->
  <text x="380" y="36" font-size="28" fill="#1c1c1c" font-weight="bold">The Agentic Loop</text>
  <text x="380" y="58" font-size="14" fill="#666">think → act → observe → repeat</text>

  <!-- Prompt in -->
  <rect class="box grey" x="30" y="150" width="140" height="64" rx="6"/>
  <text x="100" y="180" class="lbl">Your prompt</text>
  <text x="100" y="200" class="sub">"build X"</text>

  <path class="edge" d="M170,182 L214,182"/>

  <!-- THINK -->
  <rect class="box" x="216" y="150" width="130" height="64" rx="6"/>
  <text x="281" y="180" class="lbl">1 · Think</text>
  <text x="281" y="200" class="sub">plan the step</text>

  <path class="edge" d="M346,182 L400,182"/>

  <!-- ACT -->
  <rect class="box green" x="402" y="150" width="130" height="64" rx="6"/>
  <text x="467" y="180" class="lblw">2 · Act</text>
  <text x="467" y="200" class="subw">run a tool</text>

  <path class="edge" d="M532,182 L586,182"/>

  <!-- OBSERVE -->
  <rect class="box" x="588" y="150" width="140" height="64" rx="6"/>
  <text x="658" y="180" class="lbl">3 · Observe</text>
  <text x="658" y="200" class="sub">read result</text>

  <!-- loop back -->
  <path class="edge" d="M658,214 C658,300 467,300 467,300 C281,300 281,300 281,220"/>
  <text x="470" y="320" class="elbl">not done → loop again</text>

  <!-- result out -->
  <path class="edge" d="M658,150 C658,90 380,90 380,90 C120,90 100,110 100,146"/>
  <rect class="box red" x="300" y="358" width="160" height="52" rx="6"/>
  <text x="380" y="390" class="lblw">✓ Final answer</text>
  <path class="edge" d="M281,300 C281,340 340,352 355,356"/>
</svg>
